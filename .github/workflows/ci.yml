name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build deps (GUI windowing/audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Build
        run: cargo build --locked --workspace --release

      # cargo-deny and cargo-vet check the whole dependency graph whatever
      # the host, so one matrix leg is enough. Both are built from crates.io
      # at pinned versions: a new release of either cannot change what the
      # gate checks without a change here, and no extra action is needed.
      - name: Install cargo-deny + cargo-vet
        if: matrix.os == 'ubuntu-latest'
        run: cargo install --locked cargo-deny@0.19.9 cargo-vet@0.10.2

      # The full check: deny.toml configures advisories, bans, licenses and
      # sources, and a narrower invocation would stop enforcing the rest.
      - name: Supply-chain advisories/bans/licenses/sources gate
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny check

      - name: Supply-chain provenance gate
        if: matrix.os == 'ubuntu-latest'
        run: cargo vet check --locked

  # The versions Cargo.toml declares as the minimum must actually build.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build deps (GUI windowing/audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libasound2-dev pkg-config

      - name: Install the declared toolchains
        run: rustup toolchain install 1.88 1.95 --profile minimal

      - name: morse-core and morse-cli on 1.88
        run: cargo +1.88 check --locked -p morse-core -p morse-cli

      - name: morse-gui on 1.95
        run: cargo +1.95 check --locked -p morse-gui

  # Builds exactly what a release ships, on every run, so a break in
  # packaging is found on the pull request and not after a tag is public.
  # Read-only token: this job compiles the whole dependency tree and
  # installs cargo-cyclonedx, so it holds nothing worth stealing.
  package:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: macos-universal
          - os: windows-latest
            label: windows-x86_64
    env:
      # A tag name on a release run; a placeholder otherwise.
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build deps (GUI windowing/audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --locked --workspace --release

      - name: Build (universal binary)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --locked --workspace --release --target x86_64-apple-darwin
          cargo build --locked --workspace --release --target aarch64-apple-darwin
          mkdir -p target/release
          for bin in morse morse-gui; do
            lipo -create \
              target/x86_64-apple-darwin/release/$bin \
              target/aarch64-apple-darwin/release/$bin \
              -output target/release/$bin
          done

      # One CycloneDX SBOM per crate, for the runner's own target, shipped
      # inside the archive. Generated here rather than committed, so it
      # always describes the dependencies this release was built from.
      - name: Generate SBOMs
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked cargo-cyclonedx@0.5.9
          cargo cyclonedx --format json --override-filename sbom
          mkdir -p stage/sbom
          for crate in morse-core morse-cli morse-gui; do
            cp "$crate/sbom.json" "stage/sbom/$crate.cdx.json"
          done

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage dist
          cp README.md LICENSE CHANGELOG.md stage/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/morse.exe target/release/morse-gui.exe stage/
            7z a "dist/morse-${VERSION}-${{ matrix.label }}.zip" ./stage/*
          else
            cp target/release/morse target/release/morse-gui stage/
            tar -czf "dist/morse-${VERSION}-${{ matrix.label }}.tar.gz" -C stage .
          fi

      # Named per platform: all three end up in one release, and a shared
      # name would leave only one job's checksums.
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum morse-* > "SHA256SUMS-${{ matrix.label }}.txt"
          else
            shasum -a 256 morse-* > "SHA256SUMS-${{ matrix.label }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.label }}.txt"

      - name: The packaged CLI runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir unpacked
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z x dist/morse-*.zip -ounpacked >/dev/null
            out=$(unpacked/morse.exe encode SOS | tr -d '\r')
          else
            tar -xzf dist/morse-*.tar.gz -C unpacked
            out=$(unpacked/morse encode SOS)
          fi
          [ "$out" = "... --- ..." ] || { echo "unexpected output: $out"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Runs no code from the repository or its dependencies: it downloads what
  # the package jobs built, attests it and publishes. The write permissions
  # live only here. All three platforms must have built, and the release is
  # created as a draft and published once every file is attached, so there
  # is never a public release with files missing.
  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -l dist && test "$(ls dist | wc -l)" -eq 6

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/morse-*

      - name: Create draft release, attach files, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for details. Verify a download with the SHA256SUMS file for your platform and \`gh attestation verify <archive> --repo ${GITHUB_REPOSITORY}\`." \
            dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
