name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux build deps (GUI windowing/audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --release

  release:
    name: Release (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: macos-universal
          - os: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux build deps (GUI windowing/audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --workspace --release

      - name: Build (universal binary)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --workspace --release --target x86_64-apple-darwin
          cargo build --workspace --release --target aarch64-apple-darwin
          mkdir -p target/release
          for bin in morse morse-gui; do
            lipo -create \
              target/x86_64-apple-darwin/release/$bin \
              target/aarch64-apple-darwin/release/$bin \
              -output target/release/$bin
          done

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage dist
          cp README.md LICENSE CHANGELOG.md stage/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/morse.exe target/release/morse-gui.exe stage/
            7z a "dist/morse-${GITHUB_REF_NAME}-${{ matrix.label }}.zip" ./stage/*
          else
            cp target/release/morse target/release/morse-gui stage/
            tar -czf "dist/morse-${GITHUB_REF_NAME}-${{ matrix.label }}.tar.gz" -C stage .
          fi

      - name: Upload to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details." \
            2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
