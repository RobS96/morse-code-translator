# cargo-deny config — advisories, bans, licenses, sources; wired into
# mac-nightly.sh alongside cargo audit (2026-09-03).

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
    "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0",  # pulled in by the eframe/egui GUI stack
]
# Local workspace package is a private, unpublished tool — skip its own
# license-field check (still checks every dependency's license normally).
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "warn"
skip = [
    # thiserror 1.0.69 (+ thiserror-impl 1.0.69): pulled in only by winit's
    # Linux/Wayland backend chain (calloop -> smithay-client-toolkit -> winit),
    # inert on macOS — Cargo.lock resolves it because it covers all target
    # platforms, not because it's compiled into this app's binary. The rest of
    # the tree (and this backend chain's own newer deps) is on thiserror 2.x;
    # upstream (eframe/winit's own tree) hasn't converged versions yet. Flagged
    # as recurring/undocumented by nightly-error-audit 2026-09-05 — documenting
    # here rather than re-investigating it each time it shows up in cargo-deny
    # output. Re-evaluate if winit's Linux backend ever actually gets exercised
    # on this estate (it isn't — macOS only).
    { name = "thiserror", version = "1.0.69" },
    { name = "thiserror-impl", version = "1.0.69" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
