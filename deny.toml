# cargo-deny config: advisories, bans, licenses, sources. CI runs
# `cargo deny check` on every push and pull request.

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
    "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0",  # pulled in by the eframe/egui GUI stack
]
# A workspace crate marked `publish = false` would skip its own
# license-field check. None is today: all three crates declare MIT, and
# every dependency's license is checked normally.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "warn"
skip = [
    # thiserror 1.0.69 (+ thiserror-impl 1.0.69): pulled in only by winit's
    # Linux/Wayland backend chain (calloop -> smithay-client-toolkit -> winit),
    # so it is compiled into the Linux build only. The rest of the tree (and
    # this backend chain's own newer deps) is on thiserror 2.x; upstream
    # (eframe/winit's own tree) hasn't converged versions yet. Remove these
    # entries once it has.
    { name = "thiserror", version = "1.0.69" },
    { name = "thiserror-impl", version = "1.0.69" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
