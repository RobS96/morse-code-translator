[package]
name = "morse-gui"
description = "Cross-platform desktop GUI (Windows/macOS/Linux) for the Morse code translator, with live visual flash + audible tone transmission."
version.workspace = true
edition.workspace = true
# eframe/egui 0.36 declare rust-version 1.95.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "morse-gui"
path = "src/main.rs"

[dependencies]
morse-core = { path = "../morse-core", version = "0.3.0" }
# wgpu is eframe's default renderer as of 0.3x; this app is simple immediate-mode
# 2D UI with no need for it, and wgpu's Direct3D12 backend has a windows-crate
# version conflict on Windows CI as of eframe 0.36.1 — stick with glow instead.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "links",
    "wayland",
    "x11",
] }
rodio = { version = "0.22", default-features = false, features = ["playback"] }
